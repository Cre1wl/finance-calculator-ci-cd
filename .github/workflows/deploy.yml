name: CI/CD for Finance Calculator

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest test_finance.py -v

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to "Production" directory
        run: |
          # Создаем директорию для продукта, если её нет
          mkdir -p /home/ghrunner/production_app
          # Копируем файлы приложения (исключая тесты и git-служебные файлы)
          cp finance_calculator.py main.py /home/ghrunner/production_app/
          echo "Deployment completed at $(date)" >> /home/ghrunner/production_app/deploy.log